<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captura Admin - Quinielas El Inge</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{background:#0f1d33;color:white;margin:0;font-family:Arial,sans-serif}
    .captura-wrap{width:92%;max-width:900px;margin:25px auto 50px}
    .captura-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
    .captura-head h1{margin:0;font-size:32px}
    .btn-volver{background:#334155;color:#fff;border:0;border-radius:12px;padding:11px 18px;font-weight:bold;cursor:pointer}
    .selector{background:#1d2d49;border:1px solid #3b4e6e;border-radius:16px;padding:15px;margin-bottom:18px}
    .selector label{display:block;margin-bottom:8px;font-weight:bold}
    .selector select{width:100%;padding:13px;border-radius:10px;border:0;font-size:17px;background:#253754;color:#fff}
    .estado{padding:15px;border-radius:12px;text-align:center;font-weight:bold;margin:15px 0 20px}
    .estado.ok{background:#dcfce7;color:#166534}
    .estado.error{background:#fee2e2;color:#991b1b}
    .estado.info{background:#dbeafe;color:#1e3a8a}
    .datos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
    .datos input{width:100%;box-sizing:border-box;padding:15px;border-radius:12px;border:1px solid #435675;background:#1d2d49;color:#fff;font-size:17px}
    .lista-partidos{display:flex;flex-direction:column;gap:16px}
    .partido-card{background:#162844;border:1px solid #334b70;border-radius:18px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
    .liga{font-weight:bold;color:#facc15;font-size:16px;margin-bottom:5px}
    .fecha{font-size:16px;color:#dbeafe;margin-bottom:14px}
    .equipos{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;gap:10px}
    .equipo{text-align:center;font-weight:bold;min-width:0}
    .equipo img{display:block!important;width:58px!important;height:58px!important;max-width:58px!important;max-height:58px!important;object-fit:contain!important;margin:0 auto 7px!important}
    .nombre-equipo{font-size:18px;line-height:1.15;word-break:break-word}
    .vs{text-align:center;font-weight:900;color:#facc15;font-size:18px}
    .resultado-titulo{text-align:center;margin:16px 0 8px;font-size:14px;font-weight:bold;color:#cbd5e1}
    .resultado{display:flex;justify-content:center;align-items:center;gap:10px}
    .resultado input{width:70px!important;height:52px!important;box-sizing:border-box;text-align:center;font-size:24px!important;font-weight:bold!important;border-radius:10px;border:1px solid #51678d;background:#fff;color:#111}
    .guion{font-size:24px;font-weight:bold}
    .acciones{margin-top:20px}
    .btn-guardar{width:100%;padding:15px;border:0;border-radius:12px;background:#22c55e;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}
    .btn-guardar:disabled{opacity:.5;cursor:not-allowed}
    @media(max-width:700px){
      .datos{grid-template-columns:1fr}
      .captura-wrap{width:94%}
      .captura-head h1{font-size:27px}
      .equipos{grid-template-columns:1fr 48px 1fr}
      .equipo img{width:52px!important;height:52px!important;max-width:52px!important;max-height:52px!important}
      .nombre-equipo{font-size:16px}
    }
  </style>
</head>
<body>
  <div class="captura-wrap">
    <div class="captura-head">
      <h1>🔓 Captura Administrativa</h1>
      <button class="btn-volver" onclick="window.location.href='admin.html'">← Volver al Admin</button>
    </div>

    <div class="selector">
      <label for="jornada">Semana</label>
      <select id="jornada"></select>
    </div>

    <div id="estado" class="estado info">⏳ Cargando partidos...</div>

    <div class="datos">
      <input type="text" id="adminNombre" maxlength="50" placeholder="👤 Nombre del participante">
      <input type="text" id="adminTelefono" maxlength="10" inputmode="numeric" placeholder="📱 WhatsApp">
    </div>

    <div id="listaPartidos" class="lista-partidos"></div>


<!-- AGREGAR VARIAS QUINIELAS -->

<div style="margin-top:20px;">

  <button
    type="button"
    id="btnAgregarQuinielaAdmin"
    class="btn-guardar"
    style="background:#2563eb;">
    ➕ Agregar quiniela
  </button>

</div>

<!-- QUINIELAS AGREGADAS -->

<div
  id="misQuinielasAdmin"
  style="display:none; margin-top:20px;">

  <h3>🏆 Mis quinielas</h3>

  <div id="listaQuinielasAdmin"></div>

  <div
    id="resumenQuinielasAdmin"
    style="margin-top:15px;">
  </div>

</div>



    <div class="acciones">
      <button id="btnGuardar" class="btn-guardar" onclick="guardarCapturaAdmin()">🔐 Registrar Quiniela</button>
    </div>
  </div>

<script>
if (sessionStorage.getItem("admin") !== "true") {
  window.location.href = "login.html";
}

let partidos = [];
// Quinielas agregadas temporalmente desde Captura Admin
let quinielasAgregadasAdmin = [];
let registroAdminEnProceso = false;
let identificadorCompraAdmin = crypto.randomUUID();
const params = new URLSearchParams(window.location.search);
const jornadaInicial = params.get("jornada");

function cargarSemanas(){
  const select = document.getElementById("jornada");
  for(let i=1;i<=60;i++){
    const option=document.createElement("option");
    option.value=i;
    option.textContent=`Semana ${i}`;
    if(String(i)===String(jornadaInicial)) option.selected=true;
    select.appendChild(option);
  }
  select.addEventListener("change", cargarPartidos);
}

function fechaLocal(fecha){
  if(!fecha) return "Fecha pendiente";
  const d = new Date(fecha.replace(" ","T"));
  if(Number.isNaN(d.getTime())) return fecha;
  return d.toLocaleString("es-MX",{
    day:"2-digit",month:"2-digit",year:"numeric",
    hour:"2-digit",minute:"2-digit",hour12:false
  });
}

function primerPartidoLocal(){
  if(!partidos.length) return null;
  return new Date(partidos[0].fecha.replace(" ","T"));
}

function actualizarEstado(){
  const estado=document.getElementById("estado");
  const boton=document.getElementById("btnGuardar");
  const primero=primerPartidoLocal();
  if(!primero){
    estado.className="estado error";
    estado.textContent="⚠️ Esta jornada no tiene partidos.";
    boton.disabled=true;
    return;
  }
  if(new Date()>=primero){
    estado.className="estado error";
    estado.textContent="🔴 CAPTURA CERRADA — YA COMENZÓ EL PRIMER PARTIDO.";
    boton.disabled=true;
    return;
  }
  estado.className="estado ok";
  estado.textContent="🟢 CAPTURA ADMINISTRATIVA DISPONIBLE HASTA EL INICIO DEL PRIMER PARTIDO.";
  boton.disabled=false;
}

async function cargarPartidos(){
  const jornada=document.getElementById("jornada").value;


  // Limpiar quinielas temporales al cargar otra jornada
  quinielasAgregadasAdmin = [];

  const contenedor = document.getElementById("misQuinielasAdmin");
  const listaAgregadas = document.getElementById("listaQuinielasAdmin");
  const resumen = document.getElementById("resumenQuinielasAdmin");

  if (contenedor) contenedor.style.display = "none";
  if (listaAgregadas) listaAgregadas.replaceChildren();
  if (resumen) resumen.textContent = "";

  const estado=document.getElementById("estado");
  const lista=document.getElementById("listaPartidos");
  estado.className="estado info";
  estado.textContent="⏳ Cargando partidos...";
  lista.innerHTML="";
  try{
    const res=await fetch(`/partidos?jornada=${encodeURIComponent(jornada)}`);
    if(!res.ok) throw new Error("No se pudieron cargar los partidos.");
    const data=await res.json();
    partidos=(Array.isArray(data)?data:[]).slice().sort((a,b)=>{
      return new Date(a.fecha.replace(" ","T"))-new Date(b.fecha.replace(" ","T"));
    });
    if(!partidos.length){
      actualizarEstado();
      return;
    }
    for(const p of partidos){
      lista.insertAdjacentHTML("beforeend", `
        <div class="partido-card">
          <div class="liga">${p.liga || "Partido"}</div>
          <div class="fecha">📅 ${fechaLocal(p.fecha)}</div>
          <div class="equipos">
            <div class="equipo">
              ${p.logo_local ? `<img src="${p.logo_local}" alt="" onerror="this.style.display='none'">` : ""}
              <div class="nombre-equipo">${p.local || "Local"}</div>
            </div>
            <div class="vs">VS</div>
            <div class="equipo">
              ${p.logo_visitante ? `<img src="${p.logo_visitante}" alt="" onerror="this.style.display='none'">` : ""}
              <div class="nombre-equipo">${p.visitante || "Visitante"}</div>
            </div>
          </div>
          <div class="resultado-titulo">MARCADOR DEL PARTICIPANTE</div>
          <div class="resultado">
            <input type="number" min="0" max="30" inputmode="numeric" id="adminGl${p.id}" placeholder="0">
            <span class="guion">-</span>
            <input type="number" min="0" max="30" inputmode="numeric" id="adminGv${p.id}" placeholder="0">
          </div>
        </div>
      `);
    }
    actualizarEstado();
  }catch(err){
    console.error(err);
    estado.className="estado error";
    estado.textContent="❌ Error al cargar los partidos.";
    document.getElementById("btnGuardar").disabled=true;
  }
}

async function guardarCapturaAdmin(){


  // 🔒 Evitar enviar dos veces la misma captura

const botonRegistro = document.getElementById("btnGuardar");

if (registroAdminEnProceso || botonRegistro.disabled) return;


  // 📋 Utilizar las quinielas agregadas
  if (quinielasAgregadasAdmin.length === 0) {
    mostrarMensaje(
      "Sin quinielas",
      "Primero presiona ➕ Agregar quiniela para guardar tus marcadores.",
      "⚠️"
    );
    return;
  }


  if(!partidos.length){
    mostrarMensaje(
        "Sin partidos",
        "No hay partidos para registrar.",
        "⚠️"
    );
    return;
}

  const nombre=document.getElementById("adminNombre").value.trim();
  const telefono=document.getElementById("adminTelefono").value.trim();
  const jornada=document.getElementById("jornada").value;
  if(!nombre || nombre.length<2){
    mostrarMensaje(
        "Participante",
        "Escribe el nombre del participante.",
        "⚠️"
    );
    return;
}

if(telefono && !/^\d{10}$/.test(telefono)){
    mostrarMensaje(
        "WhatsApp",
        "El WhatsApp debe tener 10 dígitos.",
        "⚠️"
    );
    return;
}
  const primero=primerPartidoLocal();
 
  if(new Date()>=primero){
    actualizarEstado();

    mostrarMensaje(
        "Captura cerrada",
        "Ya comenzó el primer partido. La captura administrativa está cerrada.",
        "❌"
    );

    return;
}

  
  const password = await mostrarPassword(
    "Contraseña de administrador",
    "Escribe la contraseña para registrar la quiniela."
);

if (!password) return;

  const boton=document.getElementById("btnGuardar");
  
registroAdminEnProceso = true;
boton.disabled = true;
boton.textContent = "⏳ Registrando...";


  try{
    
const res = await fetch("/admin/guardar-multiples", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
 
body: JSON.stringify({
  password,
  nombre,
  telefono,
  jornada,
  quinielas: quinielasAgregadasAdmin,
  identificador_compra: identificadorCompraAdmin
})
});

    const data=await res.json();
    if(!res.ok || !data.ok){
     mostrarMensaje(
    "No fue posible registrar",
    data.error || "No fue posible registrar la quiniela.",
    "❌"
);
      return;
    }
    
    
    
    const cantidadRegistrada = Number(data.cantidad);
    const totalRegistrado = Number(data.total);
    const ahorroRegistrado = Number(data.ahorro || 0);

    const moneda = valor =>
      valor.toLocaleString("es-MX", {
        style: "currency",
        currency: "MXN"
      });

    mostrarMensaje(
      "🏆 Quinielas registradas",
      `✅ Registro realizado correctamente.<br><br>
      👤 Participante: <b>${nombre}</b><br>
      🎟️ Quinielas: <b>${cantidadRegistrada}</b><br>
      💰 Total: <b>${moneda(totalRegistrado)}</b>
      ${ahorroRegistrado > 0
        ? `<br>🎁 Ahorro: <b>${moneda(ahorroRegistrado)}</b>`
        : ""}`,
      "✅"
    );


    document.getElementById("adminNombre").value="";
    document.getElementById("adminTelefono").value="";


   
    // ✅ Limpiar las quinielas después de guardarlas correctamente
    quinielasAgregadasAdmin = [];

    // 🔐 Generar un identificador nuevo para la siguiente compra
    identificadorCompraAdmin = crypto.randomUUID();


    document.getElementById("listaQuinielasAdmin")
      .replaceChildren();

    document.getElementById("misQuinielasAdmin")
      .style.display = "none";

    document.getElementById("resumenQuinielasAdmin")
      .textContent = "";

    partidos.forEach(p=>{
      const gl=document.getElementById("adminGl"+p.id);
      const gv=document.getElementById("adminGv"+p.id);
      if(gl) gl.value="";
      if(gv) gv.value="";
    });
  }catch(err){
    console.error(err);
    
    mostrarMensaje(
    "Error de comunicación",
    "No fue posible comunicarse con el servidor.",
    "❌"
);
  }finally{
    registroAdminEnProceso = false;
    boton.disabled=false;
    boton.textContent="🔐 Registrar Quiniela";
    actualizarEstado();
  }
}


function agregarQuinielaAdmin() {


  // 🔒 No permitir agregar quinielas durante un registro
  if (registroAdminEnProceso) {
    mostrarMensaje(
      "Registro en proceso",
      "Espera a que termine el registro actual.",
      "⚠️"
    );
    return;
  }


  if (!partidos.length) {
    mostrarMensaje(
      "Sin partidos",
      "No hay partidos disponibles para capturar.",
      "⚠️"
    );
    return;
  }

  const primero = primerPartidoLocal();

  if (!primero || new Date() >= primero) {
    actualizarEstado();
    mostrarMensaje(
      "Captura cerrada",
      "Ya comenzó el primer partido.",
      "❌"
    );
    return;
  }

  const pronosticos = [];

  for (const p of partidos) {

    const inputLocal = document.getElementById("adminGl" + p.id);
    const inputVisitante = document.getElementById("adminGv" + p.id);

    const gl = inputLocal?.value.trim() ?? "";
    const gv = inputVisitante?.value.trim() ?? "";

    if (gl === "" || gv === "") {
      mostrarMensaje(
        "Marcador incompleto",
        `Completa el marcador de ${p.local} vs ${p.visitante}.`,
        "⚠️"
      );
      return;
    }

    const local = Number(gl);
    const visitante = Number(gv);

    if (
      !Number.isInteger(local) ||
      !Number.isInteger(visitante) ||
      local < 0 || local > 30 ||
      visitante < 0 || visitante > 30
    ) {
      mostrarMensaje(
        "Marcador inválido",
        `Revisa el marcador de ${p.local} vs ${p.visitante}.`,
        "❌"
      );
      return;
    }

    pronosticos.push({
      partido_id: Number(p.id),
      goles_local: local,
      goles_visitante: visitante
    });
  }

  quinielasAgregadasAdmin.push(pronosticos);

  const lista = document.getElementById("listaQuinielasAdmin");
  const contenedor = document.getElementById("misQuinielasAdmin");
  const resumen = document.getElementById("resumenQuinielasAdmin");

  contenedor.style.display = "block";

  lista.innerHTML = "";

  quinielasAgregadasAdmin.forEach((quiniela, index) => {

    const tarjeta = document.createElement("div");

    tarjeta.className = "partido-card";
    tarjeta.style.marginBottom = "12px";

    const titulo = document.createElement("strong");
    titulo.textContent = `🏆 Quiniela ${index + 1}`;

    const detalle = document.createElement("div");
    detalle.style.marginTop = "8px";
    detalle.style.fontSize = "14px";
    detalle.style.color = "#cbd5e1";

    detalle.textContent = quiniela
      .map(p => `${p.goles_local}-${p.goles_visitante}`)
      .join(" | ");

    tarjeta.appendChild(titulo);
    tarjeta.appendChild(detalle);

    lista.appendChild(tarjeta);
  });

const cantidad = quinielasAgregadasAdmin.length;

resumen.textContent =
  `${cantidad} quiniela(s) — Calculando precio...`;

actualizarPrecioCapturaAdmin();

  partidos.forEach(p => {
    document.getElementById("adminGl" + p.id).value = "";
    document.getElementById("adminGv" + p.id).value = "";
  });

  mostrarToast(
    `Quiniela ${cantidad} agregada correctamente.`,
    "✅"
  );
}

document
  .getElementById("btnAgregarQuinielaAdmin")
  .addEventListener("click", agregarQuinielaAdmin);


async function actualizarPrecioCapturaAdmin() {

  const cantidad = quinielasAgregadasAdmin.length;

  const resumen = document.getElementById(
    "resumenQuinielasAdmin"
  );

  if (!resumen) return;

  if (cantidad === 0) {
    resumen.textContent = "0 quinielas — $0 MXN";
    return;
  }

  try {

    const respuesta = await fetch(
      `/promocion/precio?cantidad=${cantidad}`,
      { cache: "no-store" }
    );

    if (!respuesta.ok) {
      throw new Error("No se pudo calcular el precio.");
    }

    const datos = await respuesta.json();

    // Evitar mostrar un precio anterior si cambió la cantidad
    if (cantidad !== quinielasAgregadasAdmin.length) {
      return;
    }

    const moneda = valor =>
      Number(valor).toLocaleString("es-MX", {
        style: "currency",
        currency: "MXN"
      });

    resumen.replaceChildren();

    const cantidadTexto = document.createElement("div");
    cantidadTexto.textContent =
      `${cantidad} quiniela(s)`;

    const totalTexto = document.createElement("div");
    totalTexto.style.fontWeight = "bold";
    totalTexto.style.fontSize = "20px";
    totalTexto.style.marginTop = "8px";
    totalTexto.textContent =
      `💰 Total: ${moneda(datos.precio_final)}`;

    resumen.append(cantidadTexto, totalTexto);

    if (datos.promocion && Number(datos.ahorro) > 0) {

      const promocionTexto = document.createElement("div");

      promocionTexto.style.color = "#4ade80";
      promocionTexto.style.marginTop = "10px";
      promocionTexto.style.fontWeight = "bold";

      promocionTexto.textContent =
        `🎁 ${datos.promocion.nombre} — Ahorras ${moneda(datos.ahorro)}`;

      resumen.appendChild(promocionTexto);
    }

  } catch (error) {

    console.error("Error calculando promoción:", error);

    resumen.textContent =
      "⚠️ No se pudo consultar el precio. Intenta nuevamente.";
  }
}


cargarSemanas();
cargarPartidos();
</script>

<div id="modalPersonalizado" class="modal-overlay">

  <div class="modal">

      <div id="modalIcono" class="modal-icono">⚠️</div>

      <h2 id="modalTitulo">Título</h2>

      <p id="modalMensaje">Mensaje</p>

      <input
          id="modalInput"
          type="password"
          class="modal-input"
          placeholder="Contraseña..."
          style="display:none;"
      >

      <div class="modal-botones">

          <button
              id="btnCancelar"
              class="btn-modal cancelar">
              Cancelar
          </button>

          <button
              id="btnAceptar"
              class="btn-modal aceptar">
              Aceptar
          </button>

      </div>

  </div>

</div>

<div id="toast" class="toast">

    <span id="toastIcono">✅</span>

    <span id="toastTexto">Mensaje</span>

</div>


<script src="ui.js"></script>
</body>
</html>
