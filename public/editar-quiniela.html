<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Editor de Quinielas | Quinielas El Inge</title>

    <link rel="stylesheet" href="editar-quiniela.css">

    <link rel="icon"
          type="image/png"
          href="logo.png">

</head>

<body>

<div class="admin-container">

    <div class="titulo-editor">

        <h1>📝 Editor de Quinielas</h1>

        <p>
            Selecciona una jornada, busca un participante y modifica sus pronósticos.
        </p>

    </div>

    <div class="barra-superior">

        <div class="campo">

            <label for="jornadaEditar">
                📅 Jornada
            </label>

            <select id="jornadaEditar"></select>

        </div>

        <div class="campo">

            <label for="buscarJugador">
                🔍 Buscar participante
            </label>

            <input
                id="buscarJugador"
                type="text"
                autocomplete="off"
                placeholder="Escribe el nombre...">

        </div>

    </div>

    <div class="contenedor-principal">

        <!-- Participantes -->

        <div class="panel panel-jugadores">

            <div class="panel-titulo">

                👥 Participantes

            </div>

            <div id="listaJugadores"></div>

        </div>

        <!-- Pronósticos -->

        <div class="panel panel-pronosticos">

           <div class="panel-titulo">

    <span id="tituloJugador">
        Selecciona un participante
    </span>

</div>

<div style="padding:15px;">

    <input
        id="nuevoNombre"
        type="text"
        placeholder="Nombre del participante"
        style="
            width:100%;
            padding:10px;
            margin-bottom:10px;
            font-size:16px;
        ">

    <button
        onclick="guardarNombreJugador()"
        style="
            width:100%;
            padding:10px;
            margin-bottom:20px;
        ">
        ✏️ Cambiar nombre
    </button>

</div>

<div id="listaPronosticos"></div> 

        </div>

    </div>

    <div class="barra-inferior">

        <button
            id="btnGuardar"
            onclick="guardarCambiosPronosticos()">

            💾 Guardar cambios

        </button>

    </div>

</div>

<!-- Modal personalizado -->

<div id="modalPersonalizado" class="modal-personalizado">

    <div class="modal-box">

        <div id="modalIcono" class="modal-icono">⚠️</div>

        <h2 id="modalTitulo">Título</h2>

        <p id="modalMensaje">Mensaje</p>

        <input
            id="modalInput"
            type="password"
            class="modal-input"
            placeholder="Contraseña..."
            style="display:none;">

        <div class="modal-botones">

            <button
                id="btnCancelar"
                class="btn-modal cancelar">
                Cancelar
            </button>

            <button
                id="btnAceptar"
                class="btn-modal aceptar">
                Aceptar
            </button>

        </div>

    </div>

</div>

<!-- Toast -->

<div id="toast" class="toast">

    <span id="toastIcono">✅</span>

    <span id="toastTexto"></span>

</div>

<script src="ui.js"></script>
<script src="editar-quiniela.js"></script>


</body>
</html>
