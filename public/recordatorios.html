<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Recordatorios</title>

<link rel="stylesheet" href="styles.css">
<link rel="icon" href="logo.png">

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    color:#22c55e;
}

#cantidad{

    text-align:center;

    font-size:18px;

    margin:20px;

}

.card{

    background:#1e293b;

    padding:15px;

    border-radius:12px;

    margin-bottom:12px;

}

.nombre{

    font-size:20px;

    font-weight:bold;

}

.telefono{

    color:#cbd5e1;

    margin:8px 0;

}

button{

    background:#22c55e;

    color:white;

    border:none;

    padding:10px 18px;

    border-radius:10px;

    cursor:pointer;

}

button:hover{

    opacity:.9;

}

.reiniciar-btn{

    background:#f59e0b;

    color:white;

    border:none;

    padding:14px 24px;

    border-radius:12px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    margin:20px auto;

    display:block;

}

.reiniciar-btn:hover{

    background:#d97706;

}

.fecha-recordatorio{

    margin-top:10px;

    color:#94a3b8;

    font-size:14px;

    font-weight:bold;

}

.estado-pendiente{

    margin-top:10px;

    color:#22c55e;

    font-size:15px;

    font-weight:bold;

}


/* ===========================
   MODAL PERSONALIZADO
=========================== */

.modal-personalizado{

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.65);

    display:flex;
    justify-content:center;
    align-items:center;

    opacity:0;
    visibility:hidden;

    transition:.25s;

    z-index:99999;

}

.modal-personalizado.activo{

    opacity:1;
    visibility:visible;

}

.modal-box{

    width:90%;
    max-width:420px;

    background:#132a4f;

    border-radius:18px;

    padding:30px;

    text-align:center;

    border:2px solid #facc15;

    box-shadow:0 0 25px rgba(0,0,0,.45);

    transform:scale(.75) translateY(30px);

    opacity:0;

    transition:
      transform .30s ease,
      opacity .30s ease;

}

.modal-personalizado.activo .modal-box{

    transform:scale(1) translateY(0);

    opacity:1;

}

.modal-icono{

    font-size:60px;

    margin-bottom:15px;

    transition:.25s;

}

.modal-icono.error{

    color:#ef4444;

}

.modal-icono.warning{

    color:#facc15;

}

.modal-icono.success{

    color:#22c55e;

}

.modal-icono.info{

    color:#3b82f6;

}

.modal-box h2{

    color:#facc15;

    margin-bottom:10px;

}

.modal-box p{

    color:white;

    font-size:17px;

    line-height:1.5;

    margin-bottom:25px;

}

.modal-botones{

    display:flex;

    justify-content:center;

    gap:15px;

}

.btn-modal{

    border:none;

    border-radius:10px;

    padding:12px 22px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;

}

.btn-modal:hover{

    transform:translateY(-2px);

}

.btn-modal.aceptar{

    background:#22c55e;

    color:white;

}

.btn-modal.cancelar{

    background:#dc2626 !important;

    color:#fff !important;

    border:1px solid #b91c1c !important;

}

/* ===========================
   TOAST
=========================== */

.toast{

    position:fixed;

    top:20px;

    right:20px;

    background:#22c55e;

    color:white;

    padding:15px 20px;

    border-radius:12px;

    display:flex;

    align-items:center;

    gap:12px;

    font-size:16px;

    font-weight:bold;

    box-shadow:0 10px 25px rgba(0,0,0,.35);

    z-index:999999;

    opacity:0;

    transform:translateX(120%);

    transition:
        opacity .35s ease,
        transform .35s ease;

}

.toast.mostrar{

    opacity:1;

    transform:translateX(0);

}

#toastIcono{

    font-size:22px;

}

/*=========================
 MODAL
=========================*/

.modal-overlay{

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

background:rgba(0,0,0,.55);

display:none;

justify-content:center;
align-items:center;

z-index:999999;

backdrop-filter:blur(6px);

}

.modal-overlay.activo{

display:flex;

animation:fade .18s;

}

.modal{

background:#fff;

width:420px;

max-width:92%;

padding:28px;

border-radius:18px;

text-align:center;

box-shadow:0 20px 60px rgba(0,0,0,.25);

}

.modal h2{

margin-top:15px;

font-size:26px;

color:#111827;

}

.modal p{

margin-top:12px;

color:#4b5563;

font-size:17px;

line-height:1.5;

}

.modal-icono{

font-size:70px;

}

.modal-icono.success{

color:#16a34a;

}

.modal-icono.error{

color:#dc2626;

}

.modal-icono.warning{

color:#d97706;

}

.modal-icono.info{

color:#2563eb;

}

.modal-input{

width:100%;

padding:14px;

margin-top:20px;

border-radius:10px;

border:1px solid #ddd;

font-size:18px;

}

.modal-botones{

margin-top:25px;

display:flex;

gap:12px;

justify-content:center;

}

.btn-modal{

border:none;

padding:12px 24px;

border-radius:10px;

cursor:pointer;

font-size:17px;

font-weight:bold;

transition:.25s;

}

.btn-modal:hover{

transform:translateY(-2px);

}

.aceptar{

background:#16a34a;

color:#fff;

}

.cancelar{

background:#e5e7eb;

color:#111827;

}


/*=========================
 TOAST
=========================*/

.toast{

position:fixed;

right:25px;

bottom:25px;

background:#111827;

color:white;

padding:16px 22px;

border-radius:12px;

display:flex;

gap:10px;

align-items:center;

font-size:17px;

opacity:0;

transform:translateY(20px);

transition:.30s;

z-index:999999;

}

.toast.mostrar{

opacity:1;

transform:translateY(0);

}

@keyframes fade{

from{

opacity:0;

transform:scale(.95);

}

to{

opacity:1;

transform:scale(1);

}

}

</style>

</head>

<body>

<h1>📲 Recordatorios</h1>

<button class="reiniciar-btn" onclick="reiniciarRecordatorios()">
🔄 Reiniciar Recordatorios
</button>

<div id="cantidad"></div>

<div
id="barraSeleccion"
style="
display:none;
background:#1d4ed8;
padding:12px;
border-radius:10px;
margin:15px auto;
max-width:600px;
justify-content:space-between;
align-items:center;
">

<span id="contadorSeleccion">
0 seleccionados
</span>

<div>
<button
id="btnQuitarSeleccion"
style="
background:#f59e0b;
margin-right:8px;
">
➖ Quitar
</button>

<button
id="btnEliminarSeleccion"
style="
background:#dc2626;
margin-right:8px;
">
🗑 Eliminar
</button>

<button
id="btnCancelarSeleccion"
onclick="cancelarSeleccion()"
style="
background:#64748b;
">
✖ Cancelar
</button>
</div>

</div>

<input
    id="buscar"
    type="text"
    placeholder="🔍 Buscar participante..."
    onkeyup="filtrarParticipantes()"
    style="
        width:100%;
        max-width:450px;
        display:block;
        margin:20px auto;
        padding:12px;
        border-radius:10px;
        border:none;
        font-size:16px;
    "
>

<div id="lista"></div>

<!-- Modal personalizado -->
<div id="modalPersonalizado" class="modal-personalizado">
    <div class="modal-box">

        <div id="modalIcono" class="modal-icono">⚠️</div>

        <h2 id="modalTitulo">Título</h2>

        <p id="modalMensaje">Mensaje</p>

        <div class="modal-botones">

            <button id="btnCancelar" class="btn-modal cancelar">
                Cancelar
            </button>

            <button id="btnAceptar" class="btn-modal aceptar">
                Aceptar
            </button>

        </div>

    </div>
</div>

<script src="recordatorios.js"></script>
<script src="ui.js"></script>



</body>

</html>
