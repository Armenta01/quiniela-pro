<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabla Quiniela</title>

<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" href="/logo.png">
</head>

<body>

  <div style="text-align:left; margin:10px;">
    <button style="
      background:#1e293b;
      color:white;
      padding:8px 12px;
      border-radius:8px;
    " onclick="window.location.href='index.html'">
      ⬅️ Volver
    </button>
  </div>

  <h1>🏆 Tabla General</h1>

  <select id="jornadaSelect"></select>

  <div style="
    max-width:700px;
    margin:15px auto;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  ">

    <input
      id="buscarJugador"
      type="text"
      autocomplete="off"
      placeholder="🔍 Buscar"
      style="
        padding:7px 10px;
        border-radius:8px;
        border:none;
        width:140px;
        font-size:13px;
      "
    >

    <button
      type="button"
      onclick="verMiPosicion()">
      🎯 Ver mi posición
    </button>

  </div>

  <div id="tabla" class="tabla-scroll"></div>


  <!-- =====================================================
       MODAL PERSONALIZADO
       ===================================================== -->

  <div id="modalPersonalizado" class="modal-personalizado">

    <div class="modal-box">

      <div id="modalIcono" class="modal-icono">
        ⚠️
      </div>

      <h2 id="modalTitulo">
        Título
      </h2>

      <p id="modalMensaje">
        Mensaje
      </p>

      <div class="modal-botones">

        <button
          id="btnCancelar"
          class="btn-modal cancelar"
          type="button">
          Cancelar
        </button>

        <button
          id="btnAceptar"
          class="btn-modal aceptar"
          type="button">
          Aceptar
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       TOAST
       ===================================================== -->

  <div id="toast" class="toast">

    <span id="toastIcono">
      ✅
    </span>

    <span id="toastTexto"></span>

  </div>


  <!-- =====================================================
       APP
       ===================================================== -->

  <script src="app.js"></script>
  <script src="ui.js"></script>


  <script>

    window.addEventListener("load", async function () {

      try {

        const params =
          new URLSearchParams(window.location.search);

        const jornadaURL =
          params.get("jornada");


        /*
         * Cargar las jornadas
         */
        await cargarJornadas();


        /*
         * Si viene una jornada en la URL,
         * seleccionarla.
         */
        if (jornadaURL) {

          const select =
            document.getElementById("jornadaSelect");

          if (select) {
            select.value = jornadaURL;
          }

        }


        /*
         * Obtener jornada seleccionada
         */
        const select =
          document.getElementById("jornadaSelect");

        if (!select) {
          console.error(
            "No existe #jornadaSelect"
          );
          return;
        }


        const jornada =
          select.value;


        /*
         * Cargar tabla
         */
        if (jornada) {

          await verTablaCompleta(jornada);

        }


        /*
         * Cambiar jornada
         */
        select.addEventListener(
          "change",
          function () {

            const nuevaJornada =
              this.value;

            if (nuevaJornada) {

              verTablaCompleta(
                nuevaJornada
              );

            }

          }
        );


      } catch (error) {

        console.error(
          "Error cargando tabla:",
          error
        );

      }

    });


    /*
     * =====================================================
     * RESUMEN DE PARTIDOS
     * =====================================================
     */

    async function cargarResumenPartidos(jornada) {

      try {

        const res =
          await fetch(
            `/partidos?jornada=${jornada}`
          );

        const partidos =
          await res.json();


        const cont =
          document.getElementById(
            "partidosResumen"
          );


        if (!cont) {
          return;
        }


        let html = `
          <div style="
            display:flex;
            gap:10px;
            overflow-x:auto;
            padding:10px;
          ">
        `;


        partidos.forEach(function (p) {

          const marcador =
            (
              p.goles_local != null &&
              p.goles_visitante != null
            )
              ? `${p.goles_local}-${p.goles_visitante}`
              : "⏳";


          html += `
            <div style="
              min-width:120px;
              flex:0 0 auto;
              background:#1e293b;
              padding:8px;
              border-radius:10px;
              text-align:center;
              font-size:12px;
            ">

              <div>
                ${p.local}
              </div>

              <div style="
                font-weight:bold;
              ">
                ${marcador}
              </div>

              <div>
                ${p.visitante}
              </div>

            </div>
          `;

        });


        html += `
          </div>
        `;


        cont.innerHTML =
          html;


      } catch (error) {

        console.error(
          "Error cargando resumen:",
          error
        );

      }

    }

  </script>

</body>
</html>
