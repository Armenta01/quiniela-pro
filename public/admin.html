async function logoComoDataURL(url) {

    if (!url) return null;

    try {

        const proxyUrl =
            `https://images.weserv.nl/?url=${encodeURIComponent(url)}&output=png&w=120&h=120&fit=contain`;

        console.log(
            "🖼️ Cargando logo mediante:",
            proxyUrl
        );

        const respuesta =
            await fetch(proxyUrl);

        if (!respuesta.ok) {

            throw new Error(
                `HTTP ${respuesta.status}`
            );

        }

        const blob =
            await respuesta.blob();

        if (!blob.type.startsWith("image/")) {

            throw new Error(
                `No es una imagen: ${blob.type}`
            );

        }

        return await new Promise((resolve, reject) => {

            const lector = new FileReader();

            lector.onload = () => {
                resolve(lector.result);
            };

            lector.onerror = () => {
                reject(
                    new Error(
                        "No se pudo convertir el logo"
                    )
                );
            };

            lector.readAsDataURL(blob);

        });

    } catch (error) {

        console.error(
            "❌ ERROR CARGANDO LOGO:",
            url,
            error
        );

        return null;
    }
}

async function crearPartido() {

  const local = document.getElementById('local').value.trim();
  const visitante = document.getElementById('visitante').value.trim();
  const fecha = document.getElementById('fecha').value;
  const jornada = document.getElementById('jornada').value;
  const liga = document.getElementById('liga').value.trim();
  const logo_local = document.getElementById('logo_local').value.trim();
  const logo_visitante = document.getElementById('logo_visitante').value.trim();

  // Validar campos
  if (!local || !visitante || !fecha) {

    mostrarToast(
      "Completa equipo local, visitante y fecha.",
      "aviso"
    );

    return;
  }

  try {

    // ==========================================
    // EDITAR PARTIDO EXISTENTE
    // ==========================================

    if (editandoId) {

      const res = await fetch(
        `/admin/partido/${editandoId}`,
        {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            local,
            visitante,
            fecha,
            jornada,
            liga,
            logo_local,
            logo_visitante
          })
        }
      );

      const data = await res.json();

      if (data.ok) {

        mostrarToast(
          "Partido actualizado correctamente.",
          "exito"
        );

        editandoId = null;

        document.getElementById('local').value = '';
        document.getElementById('visitante').value = '';
        document.getElementById('fecha').value = '';
        document.getElementById('liga').value = '';
        document.getElementById('logo_local').value = '';
        document.getElementById('logo_visitante').value = '';

        cargarPartidos();

        return;

      } else {

        mostrarToast(
          "❌ " + (data.error || "No fue posible actualizar el partido."),
          "error"
        );

        return;
      }
    }

    // ==========================================
    // CREAR NUEVO PARTIDO
    // ==========================================

    const res = await fetch('/admin/partidos', {

      method: 'POST',

      headers: {
        'Content-Type': 'application/json'
      },

      body: JSON.stringify({
        local,
        visitante,
        fecha,
        jornada,
        liga,
        logo_local,
        logo_visitante
      })

    });

    const data = await res.json();

    if (data.ok) {

      mostrarToast(
        "Partido guardado correctamente.",
        "exito"
      );

      document.getElementById('local').value = '';
      document.getElementById('visitante').value = '';
      document.getElementById('fecha').value = '';
      document.getElementById('liga').value = '';
      document.getElementById('logo_local').value = '';
      document.getElementById('logo_visitante').value = '';

      cargarPartidos();

    } else {

      mostrarToast(
        "❌ " + (data.error || "No fue posible guardar el partido."),
        "error"
      );

    }

  } catch (err) {

    console.error(err);

    mostrarToast(
      "❌ Error de comunicación con el servidor.",
      "error"
    );

  }

}

);

if (!confirmacion) return;


  const res = await fetch('/reset', {

async function guardarResultado(id) {
  const gl = document.getElementById("rl"+id).value;
  const gv = document.getElementById("rv"+id).value;

  if (gl === "" || gv === "") {
    mostrarMensaje(
    "Marcador incompleto",
    "Debes capturar ambos marcadores.",
    "⚠️"
);
    return;
  }

  try {
    const res = await fetch('/admin/resultado', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        partido_id: id,
        goles_local: parseInt(gl),
        goles_visitante: parseInt(gv)
      })
    });

    const data = await res.json();

    if (data.ok) {
      mostrarToast("Resultado guardado", "✅");
    } else {
       mostrarMensaje(
        "Error",
        data.error || "No fue posible guardar el resultado.",
        "❌"
      );
    }

  } catch (err) {
    console.error(err);
    mostrarMensaje("Servidor", "Error de comunicación con el servidor.", "❌");
  }
}

if (!confirmar) return;

);

  }
}

function editarPartido(id) {

  const partido = window.partidosAdmin.find(
    p => p.id == id
  );

  if (!partido) return;

  editandoId = id;

  document.getElementById("local").value =
    partido.local || "";

  document.getElementById("visitante").value =
    partido.visitante || "";

  document.getElementById("fecha").value =
    partido.fecha.substring(0,16);

  document.getElementById("logo_local").value =
    partido.logo_local || "";

  document.getElementById("logo_visitante").value =
    partido.logo_visitante || "";

  document.getElementById("liga").value =
    partido.liga || "";

    document.getElementById("jornada").value =
    partido.jornada;

  document.getElementById("msg").innerHTML =
    "✏️ Editando partido #" + id;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}
