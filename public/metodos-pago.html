<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Métodos de Pago</title>

<link rel="stylesheet" href="styles.css">
<link rel="icon" href="logo.png">

<style>

body{

    margin:0;

    padding:25px;

    background:#0f172a;

    font-family:Arial, Helvetica, sans-serif;

    color:white;

}

.contenedor-pagos{

    max-width:650px;

    margin:auto;

}

h1{

    text-align:center;

    color:#22c55e;

    margin-bottom:30px;

}

.tarjeta-pago{

    background:#1e293b;

    border-radius:16px;

    padding:20px;

    margin-bottom:25px;

    box-shadow:0 10px 25px rgba(0,0,0,.25);

}

.tarjeta-pago h2{

    margin-top:0;

    color:#f8fafc;

}

.tarjeta-pago p{

    margin:8px 0;

}

.tarjeta-pago strong{

    color:#22c55e;

}

.tarjeta-pago button{

    width:100%;

    margin-top:10px;

    margin-bottom:15px;

    padding:12px;

    border:none;

    border-radius:10px;

    background:#2563eb;

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;

}

.tarjeta-pago button:hover{

    background:#1d4ed8;

}

.aviso-pago{

    background:#fef3c7;

    color:#92400e;

    border-left:5px solid #f59e0b;

    border-radius:12px;

    padding:15px;

    margin-bottom:25px;

    line-height:1.5;

}

#btnEnviarComprobante{

    width:100%;

    padding:16px;

    border:none;

    border-radius:14px;

    background:#25D366;

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;

    animation:pulse 2s infinite;

}

#btnEnviarComprobante:hover{

    transform:translateY(-2px);

}

@keyframes pulse{

0%{

transform:scale(1);

}

50%{

transform:scale(1.03);

}

100%{

transform:scale(1);

}

}

</style>

</head>

<body>

<div class="contenedor-pagos">

    <h1>💳 Métodos de Pago</h1>

    <!-- BanCoppel -->
    <div class="tarjeta-pago">

        <h2>🏦 BanCoppel</h2>

        <p><strong>Titular</strong></p>

        <p>Eduardo Armenta López</p>

        <p><strong>Tarjeta</strong></p>

        <p id="tarjetaBanCoppel">
            4169 1606 0973 8225
        </p>

        <button id="btnCopiarTarjeta">
            📋 Copiar tarjeta
        </button>

        <p><strong>CLABE</strong></p>

        <p id="clabeBanCoppel">
            137593105314456900
        </p>

        <button id="btnCopiarClabe">
            📋 Copiar CLABE
        </button>

    </div>

    <!-- Mercado Pago -->
    <div class="tarjeta-pago">

        <h2>💙 Mercado Pago</h2>

        <p><strong>Titular</strong></p>

        <p>Eduardo Armenta López</p>

        <p><strong>Tarjeta</strong></p>

        <p id="tarjetaMP">
            7229 6901 0321 2869
        </p>

        <button id="btnCopiarMP">
            📋 Copiar tarjeta
        </button>

    </div>

    <div class="aviso-pago">

        ⚠️ Una vez realizado el pago,
        envía tu comprobante para validar
        tu participación.

    </div>

    <button id="btnEnviarComprobante">

        📤 ENVIAR COMPROBANTE

    </button>

</div>

<script src="metodos-pago.js"></script>

</body>

</html>
